name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test src/Stenwatch.Tests
      - name: no vulnerable packages
        shell: bash
        run: |
          out=$(dotnet list src/Stenwatch.sln package --vulnerable --include-transitive)
          echo "$out"
          ! echo "$out" | grep -q "has the following vulnerable packages"
      - name: software bill of materials
        shell: bash
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX src/Stenwatch.sln -o sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom
